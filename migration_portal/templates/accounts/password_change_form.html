{% extends 'accounts/base.html' %}{% block title %}Изменить пароль · Архив ИРД{% endblock %}{% block content %}<section class="account-card auth-card"><p class="eyebrow">БЕЗОПАСНОСТЬ</p><h1>Изменить пароль</h1><form method="post" class="account-form">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{% if field.field.widget.input_type == 'password' %}<span class="account-password-field">{{ field }}<button class="password-toggle" type="button" data-password-toggle aria-label="Показать пароль" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button></span>{% else %}{{ field }}{% endif %}{% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="account-primary" type="submit">Сохранить новый пароль</button></form></section>{% endblock %}

{% extends "base.html" %}
{% block title %}Записная книжка — {{ object.name }}{% endblock %}
{% block content %}
<section class="notebook-page" data-notebook data-save-url="/objects/{{ object.id }}/notebook/save">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token() }}">
    <header class="notebook-heading"><div><h1>Записная книжка</h1></div><button type="button" class="notebook-new" data-notebook-new><i class="bi bi-plus-lg" aria-hidden="true"></i> Новая запись</button></header>
    <div class="notebook-layout">
        <aside class="notebook-list panel"><h2>Записи</h2><div data-notebook-list>{% for entry in entries %}<button type="button" class="notebook-entry-button{% if loop.first %} is-active{% endif %}" data-entry-id="{{ entry.id }}" data-entry-title="{{ entry.title|e }}" data-entry-content="{{ entry.content|e }}"><strong>{{ entry.title }}</strong><small>{{ entry.updated_at }}</small></button>{% else %}<p class="notebook-empty" data-notebook-empty>Записей пока нет</p>{% endfor %}</div></aside>
        <section class="notebook-editor panel"><label class="notebook-title-label">Название записи<input data-notebook-title maxlength="300" placeholder="Например, Встреча 19 ноября"></label><div class="notebook-toolbar" role="toolbar" aria-label="Форматирование текста"><button type="button" data-command="bold" title="Жирный"><b>B</b></button><button type="button" data-command="italic" title="Курсив"><i>I</i></button><button type="button" data-command="underline" title="Подчёркнутый"><u>U</u></button><button type="button" data-command="insertUnorderedList" title="Маркированный список"><i class="bi bi-list-ul"></i></button><button type="button" data-command="insertOrderedList" title="Нумерованный список"><i class="bi bi-list-ol"></i></button><button type="button" data-block="blockquote" title="Цитата"><i class="bi bi-quote"></i></button></div><div class="notebook-content" contenteditable="true" role="textbox" aria-multiline="true" data-notebook-content data-placeholder="Введите заметку по проекту…"></div><footer class="notebook-actions"><span data-notebook-status>Изменения не сохранены</span><button type="button" class="text-danger" data-notebook-delete hidden>Удалить запись</button><button type="button" class="notebook-save" data-notebook-save>Сохранить</button></footer></section>
    </div>
    <script type="application/json" data-notebook-initial>[{% for entry in entries %}{"id":{{ entry.id }},"title":{{ entry.title|tojson }},"content":{{ entry.content|tojson }},"updated_at":{{ entry.updated_at|tojson }}}{% if not loop.last %},{% endif %}{% endfor %}]</script>
</section>
<script>
(()=>{const root=document.querySelector('[data-notebook]');if(!root)return;const csrf=document.querySelector('input[name="csrfmiddlewaretoken"]')?.value||document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';const list=root.querySelector('[data-notebook-list]'),title=root.querySelector('[data-notebook-title]'),body=root.querySelector('[data-notebook-content]'),status=root.querySelector('[data-notebook-status]'),save=root.querySelector('[data-notebook-save]'),del=root.querySelector('[data-notebook-delete]');let entries=JSON.parse(root.querySelector('[data-notebook-initial]').textContent),current=null;const setStatus=t=>status.textContent=t;const render=()=>{list.replaceChildren();if(!entries.length){const p=document.createElement('p');p.className='notebook-empty';p.textContent='Записей пока нет';list.append(p);}entries.forEach(e=>{const b=document.createElement('button');b.type='button';b.className='notebook-entry-button'+(e.id===current?' is-active':'');b.dataset.id=e.id;const strong=document.createElement('strong');strong.textContent=e.title;const small=document.createElement('small');small.textContent=e.updated_at||'';b.append(strong,small);b.addEventListener('click',()=>open(e));list.append(b);});};const open=e=>{current=e?.id||null;title.value=e?.title||'';body.innerHTML=e?.content||'';del.hidden=!current;setStatus(current?'Сохранённая запись':'Новая запись');render();};root.querySelector('[data-notebook-new]').addEventListener('click',()=>open(null));list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){const entry=entries.find(x=>String(x.id)===b.dataset.id);if(entry)open(entry);}});root.querySelectorAll('[data-command]').forEach(b=>b.addEventListener('click',()=>{body.focus();document.execCommand(b.dataset.command,false,null);}));root.querySelector('[data-block]').addEventListener('click',()=>{body.focus();document.execCommand('formatBlock',false,'blockquote');});let dirty=false;[title,body].forEach(el=>el.addEventListener('input',()=>{dirty=true;setStatus('Есть несохранённые изменения');}));save.addEventListener('click',async()=>{save.disabled=true;setStatus('Сохраняем…');try{const data=new FormData();data.append('csrfmiddlewaretoken',csrf);if(current)data.append('entry_id',current);data.append('title',title.value);data.append('content',body.innerHTML);const r=await fetch(root.dataset.saveUrl,{method:'POST',body:data,headers:{'X-CSRFToken':csrf,'Accept':'application/json'}});if(!r.ok)throw new Error('Не удалось сохранить запись');const entry=await r.json();const i=entries.findIndex(x=>x.id===entry.id);if(i>=0)entries[i]=entry;else entries.unshift(entry);current=entry.id;dirty=false;del.hidden=false;render();setStatus('Сохранено');}catch(e){setStatus(e.message);}finally{save.disabled=false;}});del.addEventListener('click',async()=>{if(!current||!confirm('Удалить эту запись?'))return;const r=await fetch(`/objects/{{ object.id }}/notebook/${current}/delete`,{method:'POST',headers:{'X-CSRFToken':csrf,'X-Requested-With':'fetch'}});if(!r.ok){setStatus('Не удалось удалить запись');return;}entries=entries.filter(e=>e.id!==current);open(entries[0]||null);});if(entries.length)open(entries[0]);else open(null);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});})();
</script>
{% endblock %}

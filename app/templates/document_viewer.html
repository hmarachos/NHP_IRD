<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Предпросмотр документа</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v='20261123-continuous-pdf-v1') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="pdf-viewer-body">
<main class="pdf-viewer" data-pdf-viewer data-document-id="{{ document_id }}" data-page-count="{{ page_count }}" data-initial-page="{{ initial_page }}" data-page-url-template="{{ page_url_template }}" data-highlight-url-template="{{ highlight_url_template }}">
    <input type="hidden" data-viewer-csrf value="{{ csrf_token() }}">
    <nav class="pdf-viewer-toolbar" aria-label="Управление просмотром PDF">
        <button type="button" data-page-prev aria-label="Предыдущая страница" title="Предыдущая страница"><i class="bi bi-chevron-left"></i></button>
        <label class="pdf-page-counter"><input type="number" value="1" min="1" max="{{ page_count }}" data-current-page aria-label="Номер страницы"><span>/ {{ page_count }}</span></label>
        <button type="button" data-page-next aria-label="Следующая страница" title="Следующая страница"><i class="bi bi-chevron-right"></i></button>
        <span class="pdf-toolbar-divider"></span>
        <button type="button" data-zoom-out aria-label="Уменьшить" title="Уменьшить"><i class="bi bi-dash-lg"></i></button>
        <span class="pdf-zoom-value" data-zoom-value>100%</span>
        <button type="button" data-zoom-in aria-label="Увеличить" title="Увеличить"><i class="bi bi-plus-lg"></i></button>
        <button type="button" data-fit-page title="По ширине страницы"><i class="bi bi-arrows-angle-expand"></i><span>По ширине</span></button>
        <a href="{{ original_url }}" target="_blank" rel="noopener" title="Открыть PDF отдельно"><i class="bi bi-box-arrow-up-right"></i></a>
    </nav>
    <div class="pdf-viewer-layout" data-pdf-layout>
        <aside class="pdf-thumbnails" data-pdf-thumbnails aria-label="Миниатюры страниц">
            {% for page in range(page_count) %}
            <button type="button" class="pdf-thumbnail{% if page == initial_page - 1 %} is-active{% endif %}" data-page-index="{{ page }}" aria-label="Страница {{ page + 1 }}" aria-pressed="{{ 'true' if page == initial_page - 1 else 'false' }}">
                <img src="{{ thumbnail_urls[page] }}" alt="" loading="{{ 'eager' if page == 0 else 'lazy' }}">
                <span>{{ page + 1 }}</span>
            </button>
            {% endfor %}
        </aside>
        <div class="pdf-viewer-splitter" data-pdf-splitter role="separator" aria-label="Изменить ширину миниатюр" aria-orientation="vertical" aria-valuemin="8" aria-valuemax="40" aria-valuenow="13" tabindex="0" title="Перетащите, чтобы изменить ширину области миниатюр"></div>
        <section class="pdf-page-viewport" data-page-viewport aria-label="Страницы документа">
            <div class="pdf-page-stream" data-page-stream>
                {% for page in range(page_count) %}
                <div class="pdf-page-stage" data-page-stage data-page-index="{{ page }}">
                <img class="pdf-page-image" data-page-image src="{{ page_image_urls[page] }}" alt="Страница {{ page + 1 }} из {{ page_count }}" loading="{{ 'eager' if page == initial_page - 1 else 'lazy' }}">
                <div class="pdf-highlight-layer" data-highlight-layer aria-hidden="true"></div>
                </div>
                {% endfor %}
            </div>
        </section>
    </div>
</main>
<script>
(() => {
    const viewer = document.querySelector('[data-pdf-viewer]');
    const layout = viewer?.querySelector('[data-pdf-layout]');
    if (!viewer || !layout) return;
    const pageCount = Number(viewer.dataset.pageCount) || 1;
    const pageInput = viewer.querySelector('[data-current-page]');
    const viewport = viewer.querySelector('[data-page-viewport]');
    const pageStages = Array.from(viewer.querySelectorAll('[data-page-stage]'));
    let highlightText = '';
    const thumbnails = Array.from(viewer.querySelectorAll('[data-page-index]'));
    const splitter = viewer.querySelector('[data-pdf-splitter]');
    const splitStorageKey = 'ird-pdf-thumbnail-width-v2';
    const previousSplitStorageKey = 'ird-pdf-thumbnail-width-v1';
    let page = Math.max(0, Math.min(pageCount - 1, (Number(viewer.dataset.initialPage) || 1) - 1));
    let zoom = 100;
    let drag = null;
    let scrollFrame = 0;
    const setRatio = (ratio, persist = true) => {
        const value = Math.max(.08, Math.min(.4, Number(ratio) || .125));
        layout.style.setProperty('--pdf-thumbnails-width', `${value * 100}%`);
        splitter.setAttribute('aria-valuenow', String(Math.round(value * 100)));
        if (persist) { try { localStorage.setItem(splitStorageKey, String(value)); } catch (_) {} }
    };
    try {
        const saved = Number(localStorage.getItem(splitStorageKey));
        if (Number.isFinite(saved) && saved > 0) setRatio(saved, false);
        else {
            const previous = Number(localStorage.getItem(previousSplitStorageKey));
            setRatio(Number.isFinite(previous) && previous > 0 ? previous / 2 : .125, false);
        }
    } catch (_) { setRatio(.125, false); }
    const setZoom = (value) => {
        zoom = Math.max(50, Math.min(200, value));
        pageStages.forEach((stage) => { stage.style.width = `${zoom}%`; });
        viewer.querySelector('[data-zoom-value]').textContent = `${zoom}%`;
    };
    const centerHighlights = (stage, rects) => {
        const centerY = rects.reduce((sum, rect) => sum + rect.y + rect.height / 2, 0) / rects.length;
        const pageTop = viewport.scrollTop + stage.getBoundingClientRect().top - viewport.getBoundingClientRect().top;
        const targetTop = pageTop + centerY * stage.offsetHeight - viewport.clientHeight / 2;
        viewport.scrollTo({top: Math.max(0, targetTop), behavior: 'smooth'});
    };
    const showHighlights = async (pageIndex) => {
        const stage = pageStages[pageIndex];
        const highlightLayer = stage?.querySelector('[data-highlight-layer]');
        if (!highlightLayer) return;
        highlightLayer.replaceChildren();
        if (!highlightText) return;
        const url = new URL(viewer.dataset.highlightUrlTemplate.replace(/0(?=$|\?)/, String(pageIndex)), window.location.href);
        try {
            const token = viewer.querySelector('[data-viewer-csrf]')?.value || '';
            const response = await fetch(url, {
                method: 'POST',
                body: new URLSearchParams({q: highlightText.slice(0, 1200), csrfmiddlewaretoken: token}),
                headers: {'X-CSRFToken': token},
                credentials: 'same-origin',
            });
            if (!response.ok) return;
            const payload = await response.json();
            (payload.rects || []).forEach((rect) => {
                const marker = document.createElement('span');
                marker.className = 'pdf-text-highlight';
                marker.style.left = `${rect.x * 100}%`;
                marker.style.top = `${rect.y * 100}%`;
                marker.style.width = `${rect.width * 100}%`;
                marker.style.height = `${rect.height * 100}%`;
                highlightLayer.append(marker);
            });
            if (pageIndex === page && payload.rects?.length) centerHighlights(stage, payload.rects);
        } catch (_) {
            // The PDF remains fully usable if optional highlight OCR fails.
        }
    };
    window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin || event.data?.type !== 'analytics-citation-highlight') return;
        highlightText = String(event.data.text || '').slice(0, 1200);
        showHighlights(page);
    });
    const syncPageControls = (index) => {
        page = Math.max(0, Math.min(pageCount - 1, Number(index) || 0));
        pageInput.value = String(page + 1);
        thumbnails.forEach((button, i) => {
            const active = i === page;
            button.classList.toggle('is-active', active);
            button.setAttribute('aria-pressed', String(active));
            if (active) button.scrollIntoView({block: 'nearest'});
        });
    };
    const setPage = (index, behavior = 'smooth') => {
        page = Math.max(0, Math.min(pageCount - 1, Number(index) || 0));
        pageInput.value = String(page + 1);
        showHighlights(page);
        pageStages[page]?.scrollIntoView({block: 'start', behavior});
        syncPageControls(page);
    };
    const syncPageFromScroll = () => {
        scrollFrame = 0;
        const viewportTop = viewport.getBoundingClientRect().top + 24;
        let closestIndex = page;
        let closestDistance = Infinity;
        pageStages.forEach((stage, index) => {
            const rect = stage.getBoundingClientRect();
            const distance = viewportTop < rect.top ? rect.top - viewportTop : (viewportTop > rect.bottom ? viewportTop - rect.bottom : 0);
            if (distance < closestDistance) { closestDistance = distance; closestIndex = index; }
        });
        if (closestIndex !== page) {
            page = closestIndex;
            syncPageControls(page);
            if (highlightText) showHighlights(page);
        }
    };
    viewport.addEventListener('scroll', () => {
        if (!scrollFrame) scrollFrame = window.requestAnimationFrame(syncPageFromScroll);
    }, {passive: true});
    thumbnails.forEach((button) => button.addEventListener('click', () => setPage(Number(button.dataset.pageIndex))));
    pageInput.addEventListener('change', () => setPage((Number(pageInput.value) || 1) - 1));
    viewer.querySelector('[data-page-prev]').addEventListener('click', () => setPage(page - 1));
    viewer.querySelector('[data-page-next]').addEventListener('click', () => setPage(page + 1));
    viewer.querySelector('[data-zoom-out]').addEventListener('click', () => setZoom(zoom - 10));
    viewer.querySelector('[data-zoom-in]').addEventListener('click', () => setZoom(zoom + 10));
    viewer.querySelector('[data-fit-page]').addEventListener('click', () => setZoom(100));
    splitter.addEventListener('pointerdown', (event) => {
        if (event.button !== undefined && event.button !== 0) return;
        drag = event.pointerId;
        splitter.classList.add('is-dragging');
        splitter.setPointerCapture(event.pointerId);
        event.preventDefault();
    });
    splitter.addEventListener('pointermove', (event) => {
        if (drag !== event.pointerId) return;
        const rect = layout.getBoundingClientRect();
        setRatio((event.clientX - rect.left) / rect.width);
    });
    const endDrag = () => { drag = null; splitter.classList.remove('is-dragging'); };
    splitter.addEventListener('pointerup', endDrag);
    splitter.addEventListener('pointercancel', endDrag);
    splitter.addEventListener('lostpointercapture', endDrag);
    splitter.addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
        event.preventDefault();
        const current = Number(splitter.getAttribute('aria-valuenow')) / 100;
        setRatio(current + (event.key === 'ArrowRight' ? .02 : -.02));
    });
    setZoom(100);
    syncPageControls(page);
    requestAnimationFrame(() => pageStages[page]?.scrollIntoView({block: 'start', behavior: 'auto'}));
})();
</script>
</body>
</html>
